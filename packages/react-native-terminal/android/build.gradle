apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.secureshell'
version = '0.1.0'

android {
  namespace "expo.modules.secureshell"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // mwiede/jsch: maintained JSch fork (ed25519, rsa-sha2, known_hosts, SFTP).
  implementation 'com.github.mwiede:jsch:0.2.25'
}
